name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Сквозная проверка на сгенерированных логах
        run: |
          logsentinel simulate --out demo
          logsentinel analyze --nginx demo/access.log --ssh demo/auth.log --year 2026 --fail-on critical || test $? -eq 2
